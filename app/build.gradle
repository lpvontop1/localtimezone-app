plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.lpvontop.localtime'
    compileSdk 34

    defaultConfig {
        applicationId "com.lpvontop.localtime"
        minSdk 28          // Android 9 Pie
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        // Release ditandatangani dengan debug key agar langsung bisa di-install.
        // Ganti dengan keystore produksi Anda untuk rilis publik.
        release {
            storeFile file('../keystore/debug.keystore')
            storePassword 'localtime'
            keyAlias 'localtime'
            keyPassword 'localtime'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        // lintVitalRelease butuh unduhan lint-gradle besar; nonaktif untuk rilis demo.
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

// Zero external dependency: hanya Kotlin stdlib (otomatis) + framework Android.
dependencies {
}
